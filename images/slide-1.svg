
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200"
     height="400"
     viewBox="0 0 1200 400">

  <title>
    Min Thein Win - Software Development Banner
  </title>

  <defs>
    <!-- Background gradient -->
    <linearGradient id="background"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f2f6fc"/>
      <stop offset="100%" stop-color="#e5edf7"/>
    </linearGradient>

    <!-- Contact gradient -->
    <linearGradient id="red"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e51d35"/>
      <stop offset="100%" stop-color="#b80c28"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow"
            x="-30%" y="-30%"
            width="160%" height="160%">
      <feDropShadow dx="0" dy="5"
                    stdDeviation="7"
                    flood-color="#24344c"
                    flood-opacity="0.18"/>
    </filter>

    <!-- Photo clipping -->
    <clipPath id="photoClip">
      <circle cx="155" cy="165" r="112"/>
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200"
        height="400"
        fill="url(#background)"/>

  <!-- Decorative accents -->
  <path d="M0 0 H80 L0 180 Z"
        fill="#d81935"/>

  <path d="M0 400 L0 300 L110 400 Z"
        fill="#d81935"/>

  <!-- PROFILE PHOTO -->
  <circle cx="155" cy="165" r="123"
          fill="#ffffff"
          filter="url(#shadow)"/>

  <circle cx="155" cy="165" r="116"
          fill="none"
          stroke="#d81935"
          stroke-width="5"/>

  <!-- Put profile.png in the same folder -->
  <image x="43" y="53"
         width="224" height="224"
         href="profile.png"
         xlink:href="profile.png"
         preserveAspectRatio="xMidYMid slice"
         clip-path="url(#photoClip)"/>

  <!-- NAME -->
  <text x="155" y="320"
        font-family="Arial, sans-serif"
        font-size="23"
        font-weight="bold"
        fill="#162b48"
        text-anchor="middle">
    MIN THEIN WIN
  </text>

  <text x="155" y="345"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#59687b"
        text-anchor="middle">
    Software Developer \ Software Engineer
  </text>

  <!-- MAIN HEADING -->
  <text x="325" y="83"
        font-family="Arial, sans-serif"
        font-size="44"
        font-weight="bold"
        fill="#142b4a">
    Software Development
  </text>

  <!-- SKILLS -->
  <text x="327" y="122"
        font-family="Arial, sans-serif"
        font-size="23"
        font-weight="bold"
        fill="#d81935">
    Android • iOS • IoT
  </text>

  <text x="327" y="154"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#142b4a">
    C#/.NET • AI • Backend API Development
  </text>

  <!-- TAGLINE -->
  <text x="327" y="184"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#627086">
    Building smart, reliable, and scalable solutions.
  </text>

  <!-- TECHNOLOGY CARDS -->
  <g font-family="Arial, sans-serif"
     font-size="14"
     font-weight="bold"
     text-anchor="middle">

    <!-- Android -->
    <rect x="325" y="212"
          width="100" height="53"
          rx="12" fill="#ffffff"
          filter="url(#shadow)"/>

    <text x="375" y="245"
          fill="#38a34a">
      Android
    </text>

    <!-- iOS -->
    <rect x="435" y="212"
          width="70" height="53"
          rx="12" fill="#ffffff"
          filter="url(#shadow)"/>

    <text x="470" y="245"
          fill="#27364a">
      iOS
    </text>

    <!-- IoT -->
    <rect x="515" y="212"
          width="70" height="53"
          rx="12" fill="#ffffff"
          filter="url(#shadow)"/>

    <text x="550" y="245"
          fill="#087ba9">
      IoT
    </text>

    <!-- C#/.NET -->
    <rect x="595" y="212"
          width="90" height="53"
          rx="12" fill="#ffffff"
          filter="url(#shadow)"/>

    <text x="640" y="245"
          fill="#6547a9">
      C#/.NET
    </text>

    <!-- AI -->
    <rect x="695" y="212"
          width="60" height="53"
          rx="12" fill="#ffffff"
          filter="url(#shadow)"/>

    <text x="725" y="245"
          fill="#d81935">
      AI
    </text>

    <!-- Backend API -->
    <rect x="765" y="212"
          width="165" height="53"
          rx="12" fill="#ffffff"
          filter="url(#shadow)"/>

    <text x="847.5" y="245"
          fill="#0c7b88">
      Backend API
    </text>

  </g>

  <!-- CONTACT SECTION -->
  <rect x="325" y="290"
        width="555" height="64"
        rx="15"
        fill="url(#red)"
        filter="url(#shadow)"/>

  <text x="350" y="316"
        font-family="Arial, sans-serif"
        font-size="13"
        font-weight="bold"
        fill="#ffe6e9">
    GET IN TOUCH
  </text>

  <a href="mailto:mmtw.cs@gmail.com"
     xlink:href="mailto:mmtw.cs@gmail.com">

    <text x="350" y="341"
          font-family="Arial, sans-serif"
          font-size="22"
          font-weight="bold"
          fill="#ffffff">
      mmtw.cs@gmail.com
    </text>

  </a>

  <!-- CANADIAN MAPLE LEAF -->
  <g transform="translate(1040 100)"
     fill="#d81935"
     opacity="0.78">

    <path d="
      M0 -64
      L14 -28
      34 -40
      29 -14
      55 -8
      32 10
      42 29
      10 25
      7 65
      -7 65
      -10 25
      -42 29
      -32 10
      -55 -8
      -29 -14
      -34 -40
      -14 -28
      Z"/>
  </g>

  <!-- CANADIAN SKYLINE -->
  <g fill="#9fb0c6" opacity="0.45">

    <rect x="930" y="295"
          width="27" height="105"/>

    <rect x="965" y="270"
          width="38" height="130"/>

    <rect x="1010" y="305"
          width="32" height="95"/>

    <rect x="1050" y="282"
          width="43" height="118"/>

    <rect x="1100" y="315"
          width="35" height="85"/>

    <rect x="1140" y="290"
          width="42" height="110"/>

  </g>

  <!-- LOCATION -->
  <text x="1060" y="380"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold"
        text-anchor="middle"
        fill="#d81935">
    Currently in Canada
  </text>

</svg>
