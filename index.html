<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mon Calendar Slideshow</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="ad-container">

    <div class="slideshow-wrapper">

        <div class="slides-container">

            <!-- ==============================
                 SLIDE 1 - CLICKABLE
            =============================== -->

            <div
                class="slide fade slide--store"
                data-slide="1"
            >

                <img
                    src="images/slide-1.svg"
                    alt="Mon Calendar App Update"
                >

                <a
                    href="https://play.google.com/store/apps/details?id=com.mtw.moncalendar"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="slide-hit-area"
                    aria-label="Open Mon Calendar on Google Play"
                    onclick="return openExternalLink(event, this.href);"
                ></a>

            </div>


            <!-- ==============================
                 SLIDE 2
            =============================== -->

            <div
                class="slide fade"
                data-slide="2"
            >

                <img
                    src="images/slide-2.svg"
                    alt="Mon Calendar"
                >

            </div>


            <!-- ==============================
                 SLIDE 3 - CLICKABLE
            =============================== -->

            <div
                class="slide fade slide--store"
                data-slide="3"
            >

                <img
                    src="images/slide-3.svg"
                    alt="Download Mon Calendar"
                >

                <a
                    href="https://play.google.com/store/apps/details?id=com.mtw.moncalendar"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="slide-hit-area"
                    aria-label="Open Mon Calendar on Google Play"
                    onclick="return openExternalLink(event, this.href);"
                ></a>

            </div>


            <!-- ==============================
                 SLIDE 4
            =============================== -->

            <div
                class="slide fade"
                data-slide="4"
            >

                <img
                    src="images/slide-4.svg"
                    alt="Mon Calendar Features"
                >

            </div>


            <!-- ==============================
                 SLIDE 5
            =============================== -->

            <div
                class="slide fade"
                data-slide="5"
            >

                <img
                    src="images/slide-5.svg"
                    alt="Mon Calendar"
                >

            </div>

        </div>


        <!-- PREVIOUS -->

        <button
            type="button"
            class="prev"
            onclick="changeSlide(-1)"
            aria-label="Previous slide"
        >
            &#10094;
        </button>


        <!-- NEXT -->

        <button
            type="button"
            class="next"
            onclick="changeSlide(1)"
            aria-label="Next slide"
        >
            &#10095;
        </button>

    </div>


    <!-- DOTS -->

    <div class="dots-container">

        <button
            type="button"
            class="dot"
            onclick="currentSlide(1)"
            aria-label="Slide 1"
        ></button>

        <button
            type="button"
            class="dot"
            onclick="currentSlide(2)"
            aria-label="Slide 2"
        ></button>

        <button
            type="button"
            class="dot"
            onclick="currentSlide(3)"
            aria-label="Slide 3"
        ></button>

        <button
            type="button"
            class="dot"
            onclick="currentSlide(4)"
            aria-label="Slide 4"
        ></button>

        <button
            type="button"
            class="dot"
            onclick="currentSlide(5)"
            aria-label="Slide 5"
        ></button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
