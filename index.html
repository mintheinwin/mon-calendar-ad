<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mon Calendar Slideshow</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <div class="ad-container">

        <div class="slideshow-wrapper">

            <div class="slides-container">


                <!-- =====================================
                     SLIDE 1
                     CLICKABLE GOOGLE PLAY LINK
                ====================================== -->

                <div
                    class="slide fade slide--store"
                    data-slide="1"
                >

                    <img
                        src="images/slide-1.svg"
                        alt="Mon Calendar App Update"
                    >

                    <a
                        href="https://play.google.com/store/apps/details?id=com.mtw.moncalendar"
                        class="slide-hit-area"
                        aria-label="Open Mon Calendar on Google Play"
                    ></a>

                    <div class="slide-caption">
                        Mon Calendar App Update
                    </div>

                </div>


                <!-- =====================================
                     SLIDE 2
                ====================================== -->

                <div
                    class="slide fade"
                    data-slide="2"
                >

                    <img
                        src="images/slide-2.svg"
                        alt="Mon Calendar"
                    >

                    <div class="slide-caption">
                        Mon Myanmar Calendar
                    </div>

                </div>


                <!-- =====================================
                     SLIDE 3
                     CLICKABLE GOOGLE PLAY LINK
                ====================================== -->

                <div
                    class="slide fade slide--store"
                    data-slide="3"
                >

                    <img
                        src="images/slide-3.svg"
                        alt="Download Mon Calendar"
                    >

                    <a
                        href="https://play.google.com/store/apps/details?id=com.mtw.moncalendar"
                        class="slide-hit-area"
                        aria-label="Open Mon Calendar on Google Play"
                    ></a>

                    <div class="slide-caption">
                        Download Mon Calendar
                    </div>

                </div>


                <!-- =====================================
                     SLIDE 4
                ====================================== -->

                <div
                    class="slide fade"
                    data-slide="4"
                >

                    <img
                        src="images/slide-4.svg"
                        alt="Mon Calendar Features"
                    >

                    <div class="slide-caption">
                        Mon Calendar Features
                    </div>

                </div>


                <!-- =====================================
                     SLIDE 5
                ====================================== -->

                <div
                    class="slide fade"
                    data-slide="5"
                >

                    <img
                        src="images/slide-5.svg"
                        alt="Mon Calendar"
                    >

                    <div class="slide-caption">
                        Mon Calendar
                    </div>

                </div>

            </div>


            <!-- =========================================
                 PREVIOUS BUTTON
            ========================================== -->

            <button
                type="button"
                class="prev"
                onclick="changeSlide(-1)"
                aria-label="Previous slide"
            >
                &#10094;
            </button>


            <!-- =========================================
                 NEXT BUTTON
            ========================================== -->

            <button
                type="button"
                class="next"
                onclick="changeSlide(1)"
                aria-label="Next slide"
            >
                &#10095;
            </button>

        </div>


        <!-- =============================================
             DOT INDICATORS
        ============================================== -->

        <div class="dots-container">

            <span
                class="dot"
                onclick="currentSlide(1)"
            ></span>

            <span
                class="dot"
                onclick="currentSlide(2)"
            ></span>

            <span
                class="dot"
                onclick="currentSlide(3)"
            ></span>

            <span
                class="dot"
                onclick="currentSlide(4)"
            ></span>

            <span
                class="dot"
                onclick="currentSlide(5)"
            ></span>

        </div>


        <!-- =============================================
             CTA SECTION
        ============================================== -->

        <div class="cta-section">

            <a
                href="https://play.google.com/store/apps/details?id=com.mtw.moncalendar"
                class="cta-button"
            >
                Get Mon Calendar
            </a>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
